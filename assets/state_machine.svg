<svg xmlns="http://www.w3.org/2000/svg" width="1550" height="750" viewBox="0 0 1550 750">
<rect width="1550" height="750" rx="28" fill="#09090f"/>
<text x="775" y="58" text-anchor="middle" font-family="Arial" font-size="36" font-weight="700" fill="#e2e2e2">Game-state machine</text>
<text x="775" y="95" text-anchor="middle" font-family="Arial" font-size="18" fill="#666678">the judge advances one controlled phase at a time</text>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#777789"/></marker></defs>

<g font-family="Arial" font-size="20" text-anchor="middle" fill="#e2e2e2">
<rect x="70" y="180" width="180" height="86" rx="16" fill="#181828" stroke="#c0392b" stroke-width="3"/><text x="160" y="230">SETUP</text>
<rect x="320" y="180" width="180" height="86" rx="16" fill="#181828" stroke="#c0392b" stroke-width="3"/><text x="410" y="230">DEALING</text>
<rect x="570" y="180" width="180" height="86" rx="16" fill="#181828" stroke="#c0392b" stroke-width="3"/><text x="660" y="230">ROLES</text>
<rect x="820" y="180" width="180" height="86" rx="16" fill="#181828" stroke="#c0392b" stroke-width="3"/><text x="910" y="230">NIGHT 1</text>
<rect x="1070" y="180" width="180" height="86" rx="16" fill="#181828" stroke="#b8860b" stroke-width="3"/><text x="1160" y="230">DAY</text>
<rect x="1300" y="180" width="180" height="86" rx="16" fill="#181828" stroke="#c0392b" stroke-width="3"/><text x="1390" y="230">VOTING</text>

<rect x="1070" y="440" width="180" height="86" rx="16" fill="#181828" stroke="#6a3a00" stroke-width="3"/><text x="1160" y="490">LAST WORD</text>
<rect x="820" y="440" width="180" height="86" rx="16" fill="#181828" stroke="#0c3060" stroke-width="3"/><text x="910" y="490">NIGHT</text>
<rect x="570" y="440" width="180" height="86" rx="16" fill="#181828" stroke="#c0392b" stroke-width="3"/><text x="660" y="490">NEXT DAY</text>
<rect x="250" y="440" width="220" height="86" rx="16" fill="#181828" stroke="#FFD700" stroke-width="3"/><text x="360" y="490">WIN CHECK</text>
<rect x="70" y="440" width="130" height="86" rx="16" fill="#181828" stroke="#e74c3c" stroke-width="3"/><text x="135" y="490">END</text>
</g>

<g stroke="#777789" stroke-width="3" fill="none" marker-end="url(#a)">
<line x1="250" y1="223" x2="320" y2="223"/>
<line x1="500" y1="223" x2="570" y2="223"/>
<line x1="750" y1="223" x2="820" y2="223"/>
<line x1="1000" y1="223" x2="1070" y2="223"/>
<line x1="1250" y1="223" x2="1300" y2="223"/>
<path d="M1390 266 L1390 365 L1160 365 L1160 440"/>
<line x1="1070" y1="483" x2="1000" y2="483"/>
<line x1="820" y1="483" x2="750" y2="483"/>
<line x1="570" y1="483" x2="470" y2="483"/>
<line x1="250" y1="483" x2="200" y2="483"/>
</g>

<path d="M360 440 C360 350, 1150 350, 1150 266" fill="none" stroke="#777789" stroke-width="3" marker-end="url(#a)"/>
<text x="750" y="330" text-anchor="middle" font-family="Arial" font-size="16" fill="#666678">no winner → continue game</text>
<text x="217" y="466" text-anchor="middle" font-family="Arial" font-size="15" fill="#e74c3c">winner</text>

<text x="775" y="650" text-anchor="middle" font-family="Arial" font-size="20" fill="#e2e2e2">Voting itself has a nested state machine:</text>
<text x="775" y="690" text-anchor="middle" font-family="Arial" font-size="19" fill="#FFD700">initial → defense → re-vote → raise-both → done</text>
</svg>